name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate app icons from logo (optional)
        continue-on-error: true
        run: |
          if [ -f www/img/logo.png ]; then
            mkdir -p assets
            cp www/img/logo.png assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#FCFBF3' --iconBackgroundColorDark '#FCFBF3'
          fi

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Butil-POS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Butil-POS-apk
          path: Butil-POS.apk
